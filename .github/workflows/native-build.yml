name: Native desktop acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA to build
        required: true
        default: 80aef01eca657fa8a2dbe3340bac27e048619b11
        type: string
  pull_request:
    paths:
      - 'edge/**'
      - 'models/**'
      - 'renderer/assets/so101/**'
      - 'main.js'
      - 'preload.js'
      - 'recording-manager.js'
      - 'edge-supervisor.js'
      - 'device-provisioning.js'
      - 'renderer/app.js'
      - 'renderer/style.css'
      - 'tests/**'
      - 'docs/desktop/**'
      - 'scripts/build-edge-runtime.py'
      - 'package.json'
      - 'requirements-edge.txt'
      - '.github/workflows/native-build.yml'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage deb --x64
          - os: windows-latest
            target: --win nsis --x64
          - os: macos-15
            target: --mac dmg --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-edge.txt
      - run: python -m unittest discover -s edge/tests -v
      - run: npm ci
      - run: npm test
      - run: npm run build:edge-runtime
        shell: bash
      - run: npm run build:renderer
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - run: npm run release:checksums
      - name: Record build provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          printf 'source_sha=%s\nworkflow_run_id=%s\nworkflow_run_url=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > dist/phase6-candidate/BUILD_PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vista-lab-station-${{ matrix.os }}
          path: dist/phase6-candidate/**
          if-no-files-found: error

